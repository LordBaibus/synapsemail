name: email_app
description: "A Gmail-like email client with a Liquid Glass UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking - all backend communication goes through HTTP (per requirement).
  http: ^1.2.2

  # Loading skeletons for ListView.generate-based lists (inbox/sent lists).
  # Pinned to 3.x: 1.4.x's Canvas shim predates Flutter's newer
  # clipRSuperellipse/drawRSuperellipse Canvas methods and fails to compile
  # on recent Flutter SDKs.
  skeletonizer: ^3.0.0

  # iOS 26 "Liquid Glass" widget kit - used as the main UI toolkit instead of
  # building raw material widgets.
  liquid_glass_widgets: 0.2.1-dev.8

  # Local session/token persistence (auth token, logged-in user).
  shared_preferences: ^2.3.2

  # Relative timestamps ("2m ago", "Yesterday") for the inbox list.
  intl: ^0.19.0

  # Native file/photo picker for compose-screen attachments (gallery,
  # camera roll, and general file browsing, like Gmail's attach button).
  #
  # Pinned to the 10.3.x line specifically: 8.1.4 (our original pin)
  # resolved to 8.3.7, whose Android build fails against Flutter's current
  # SDK because the transitive flutter_plugin_android_lifecycle dependency
  # requires compileSdk 36+ while file_picker 8.3.7's own Android module
  # was still built against 34 (Gradle error: ":file_picker:checkDebugAarMetadata").
  # 10.3.3 is the first release that fixed this ("Updated compileSdk to use
  # flutter.compileSdkVersion" per the changelog). 11.0.0 is excluded because
  # it's a breaking change - FilePicker.platform is removed in favor of
  # static FilePicker.pickFiles() calls, which our compose_screen.dart code
  # does not use.
  file_picker: ">=10.3.3 <11.0.0"

  # Opens a non-image attachment (PDF, doc, etc.) in the device's own
  # viewer/browser when tapped in the thread view.
  url_launcher: ^6.3.2

  # Powers the "Save"/"Share" action on a photo or attachment: hands the
  # downloaded file bytes to the OS share sheet, which is what actually
  # lets the user pick "Save Image"/"Save to Files" - a plain URL can't do
  # that since it doesn't carry our app's auth, and file_picker only reads
  # files, it doesn't write/export them.
  share_plus: ^10.1.4

  # share_plus's ShareParams takes a list of XFile - this is the package
  # XFile actually lives in (share_plus builds on it but doesn't re-export
  # the class itself, so it needs its own explicit dependency/import).
  cross_file: ^0.3.4+2

  # Temp-directory path for the file this app writes right before handing
  # it to share_plus (share_plus needs a real file on disk, not just bytes).
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the Android/iOS launcher icon files below from one source
  # image (`flutter pub run flutter_launcher_icons` regenerates them - this
  # is a build-time tool, not something the running app depends on).
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Launcher icon config for flutter_launcher_icons. image_path is a static
# PNG rendering of the SynapseLogo widget (lib/widgets/synapse_logo.dart) -
# that widget is drawn live in code with an animation, which a launcher
# icon can't do, so this is a fixed-frame version of the same neuron/
# synapse cluster, same violet/cyan palette, on the app's own dark
# background. adaptive_icon_* supplies a transparent-background version as
# the foreground layer for Android's adaptive icon system (the background
# color fills in behind it, matching the dark backdrop used elsewhere).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
