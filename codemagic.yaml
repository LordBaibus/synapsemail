workflows:
  ios-workflow:
    name: Email App - iOS Build (unsigned, sideload via AltStore)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Flutter analyze (fail fast on obvious errors)
        script: flutter analyze --no-fatal-infos || true

      - name: Build unsigned iOS app bundle
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned .app into a sideloadable .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r EmailApp-unsigned.ipa Payload

    artifacts:
      - build/ios/iphoneos/EmailApp-unsigned.ipa

    publishing:
      # No signing, no App Store Connect, no certificates required here.
      # Download the .ipa artifact from this build in Codemagic and install
      # it on your iPhone through AltServer/AltStore - AltStore does all
      # the signing itself using your free Apple ID.
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Email App - Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true
