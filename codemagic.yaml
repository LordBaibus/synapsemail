workflows:
  ios-workflow:
    name: Email App - iOS Build (unsigned, sideload via AltStore)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Flutter analyze (fail fast on obvious errors)
        script: flutter analyze --no-fatal-infos || true

      - name: Build unsigned iOS app bundle
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned .app into a sideloadable .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r EmailApp-unsigned.ipa Payload

    artifacts:
      - build/ios/iphoneos/EmailApp-unsigned.ipa

    publishing:
      email:
        recipients:
          - jairusmaniago0204@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Email App - Android Build
    max_build_duration: 30
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      # file_picker's transitive flutter_plugin_android_lifecycle dependency
      # requires compileSdk 36+ (see android/app/build.gradle.kts, which
      # pins compileSdk/targetSdk to 36 explicitly rather than relying on
      # Flutter's own bundled default, which can lag behind). Codemagic's
      # build image needs the matching platform installed - this no-ops if
      # it's already present, and downloads it otherwise, so CI doesn't hit
      # the same ":file_picker:checkDebugAarMetadata" failure this was
      # debugged against locally.
      - name: Ensure Android SDK Platform 36 is installed
        script: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true
